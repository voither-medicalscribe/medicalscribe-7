    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            colors: {
              'brand-background': '#F8F9FA',
              'brand-surface': '#F8F9FA', // Matching background for neumorphism
              'brand-border': '#E5E7EB',
              'brand-text-primary': '#1F2937',
              'brand-text-secondary': '#4B5563',
              'brand-accent': '#1A5F71',
            },
            backgroundImage: {
              'accent-primary': 'linear-gradient(to right, #1A5F71, #298FA6)',
              'accent-primary-hover': 'linear-gradient(to right, #298FA6, #1A5F71)',
              'accent-red': 'linear-gradient(to right, #DC2626, #EF4444)',
              'accent-red-hover': 'linear-gradient(to right, #EF4444, #DC2626)',
              'accent-ai': 'linear-gradient(to right, #8B5CF6, #A78BFA)',
              'accent-ai-hover': 'linear-gradient(to right, #A78BFA, #8B5CF6)',
            },
            boxShadow: {
              // Neumorphic shadows for a soft, tactile feel
              'neumorphic': '6px 6px 12px #e5e7eb, -6px -6px 12px #ffffff',
              'neumorphic-inset': 'inset 6px 6px 12px #e5e7eb, inset -6px -6px 12px #ffffff',
            }
          }
        }
      }
    </script>
